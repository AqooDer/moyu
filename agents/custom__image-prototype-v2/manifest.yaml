schema_version: "1"
agent_id: custom/image-prototype-v2
name: 生图原型 Agent
description: 通过 OpenAI-compatible 图片中转接口生成 UI 概念图，并保存可追踪产物。
version: 0.1.0
recipe_ref: image-gen/prototype-v1
ui_ref: ./ui.yaml
tags:
  - image-generation
  - prototype
  - meta-agent-generated
inputs_schema:
  type: object
  required:
    - prompt
  properties:
    prompt:
      type: string
      minLength: 1
      maxLength: 2000
    count:
      type: integer
      minimum: 1
      maximum: 12
      default: 3
    raw_prompt:
      type: boolean
      default: false
outputs_schema:
  type: object
  required:
    - artifacts
    - metadata
  properties:
    artifacts:
      type: array
      items:
        type: object
        properties:
          artifact_ref:
            type: string
          role:
            type: string
          mime:
            type: string
    metadata:
      type: object
      properties:
        trace_ref:
          type: string
        prompt_used:
          type: string
routing:
  model_tiers:
    - medium
    - image-generation
  default_model: gpt-image-2
permissions:
  host.network.fetch:
    - ${agent.config.provider.base_url}
  host.artifact.write:
    scope: run
workflow:
  kind: sequence
  steps:
    - id: image_gen_via_relay
      skill: ./skills/image_gen_via_relay
created_by: meta-agent
created_at: 2026-06-02T06:33:34.093Z
updated_at: 2026-06-02T06:33:34.093Z
